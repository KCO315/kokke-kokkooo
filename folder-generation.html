<!DOCTYPE html>
<html lang="ja">

<head>
	<meta name="robots" content="noindex">
	<meta charset="UTF-8">
	<title>準備モード │ 発表配信ツール コッケコッコー!!!</title>
	<script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"
		integrity="sha384-E1pALgGQd5jo9+CjsxlKe6NWRynty/TMVcFeBANdn+V5RTR5v+POlW5Ys+JJrUa8"
		crossorigin="anonymous"></script>
	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"
		integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs"
		crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
		integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"
		crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"
		integrity="sha384-PlRSzpewlarQuj5alIadXwjNUX+2eNMKwr0f07ShWYLy8B6TjEbm7ZlcN/ScSbwy"
		crossorigin="anonymous"></script>
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" href="favicon.ico">
</head>

<body>
	<!-- サイドバー -->
	<div id="csv-sidebar">
		<div id="sidebar-header">
			<div class="brand-logo">
				<div class="brand-icon-box">
					<i data-lucide="folder-plus" style="width: 20px; height: 20px;"></i>
				</div>
				<span class="brand-title">準備モード <span style="font-size: 10px;">フォルダ生成</span></span>
			</div>
		</div>

		<div id="csv-scroll-area">
			<div class="sticky-top">
				<label class="csv-btn csv-btn-yellow" id="csv-upload-dropzone"
					style="flex-direction: column; gap: 4px; padding: 12px 8px; text-align: center;">
					<div style="display: flex; align-items: center; gap: 8px;">
						<i data-lucide="file-spreadsheet"></i> CSVを読み込む
					</div>
					<span style="font-size: 11px; font-weight: normal;">(またはドラッグ＆ドロップ)</span>
					<input type="file" id="csv-file" accept=".csv" class="hidden" />
				</label>
				<div style="text-align: center; margin-top: 10px;">
					<a target="_blank"
						style="color:#007b5e; text-decoration:underline; word-break:break-all; font-size:0.8rem;"
						href="https://drive.google.com/file/d/1JoGCsHNYkgiG49YZDgzf6DhyTRbQ9clW/view?usp=sharing">サンプルCSVはこちら<i
							data-lucide="external-link"
							style="width:14px; height:14px; margin-left: 2px; vertical-align: middle;"></i></a>
				</div>
				<p id="csv-empty-hint" style="font-size: 13px; color: #555; margin: 12px 0 0 0; line-height: 1.4;">
					CSVを読み込むと、ここに操作ボタンが表示されます
				</p>
			</div>

			<div id="csv-controls" class="hidden" style="padding: 15px;">
				<div class="csv-box">
					<label class="csv-label" style="display: flex; align-items: center; gap: 6px;">
						<i data-lucide="list" style="width: 16px; height: 16px;"></i>回答リスト
					</label>
					<div style="display: flex; gap: 8px; align-items: center;">
						<button id="csv-prev-btn" class="csv-icon-btn"><i data-lucide="chevron-left"
								style="width:16px; height:16px;"></i></button>
						<select id="csv-row-select" class="csv-select"></select>
						<button id="csv-next-btn" class="csv-icon-btn"><i data-lucide="chevron-right"
								style="width:16px; height:16px;"></i></button>
					</div>
				</div>

				<div class="csv-box">
					<label class="csv-label" style="display: flex; align-items: center; gap: 6px;">
						<i data-lucide="eye-off" style="width: 16px; height: 16px;"></i>非表示にする項目
					</label>
					<p class="csv-note">配信に映したくない項目を非表示にできます</p>
					<div id="csv-column-checkboxes"></div>
				</div>

				<!-- URLの表記方法 -->
				<div class="csv-box">
					<label class="csv-label" style="display: flex; align-items: center; gap: 6px;">
						<i data-lucide="link" style="width: 16px; height: 16px;"></i>URLの表記方法
					</label>
					<p class="csv-note">URLの伏せ字スタイルを変更できます</p>
					<select id="csv-url-format" class="csv-select">
						<option value="number">URL-01</option>
						<option value="domain" selected>URL-01__ドメイン</option>
						<option value="none">（伏字にしない）</option>
					</select>
				</div>

				<!-- カテゴリ設定エリア -->
				<div class="csv-box">
					<label class="csv-label" style="display: flex; align-items: center; gap: 6px;">
						<i data-lucide="tag" style="width: 16px; height: 16px;"></i>ジャンル設定（任意）
					</label>
					<p class="csv-note">フォルダの先頭に表示されます。研究の分類、発表順の整理、自分用のメモなどに使えます</p>
					<input type="text" id="csv-tag-input" class="csv-select" placeholder="例：泥団子,◯日目,要連絡"
						autocomplete="off">
					<div id="category-history-container"
						style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;"></div>
				</div>

				<div class="csv-box">
					<button id="csv-filename-accordion-btn" class="csv-accordion-btn">
						<span style="display: flex; align-items: center; gap: 6px;">
							<i data-lucide="folder-edit" style="width: 16px; height: 16px;"></i>ファイル名に含める項目
						</span>
						<i data-lucide="chevron-down" id="csv-filename-accordion-icon"
							style="transition: transform 0.2s;"></i>
					</button>
					<div id="csv-filename-accordion-content" class="hidden">
						<p class="csv-note">ONにすると、フォルダ名に反映されます。ドラッグで順序を変えられます</p>
						<div id="csv-filename-checkboxes"></div>
					</div>
				</div>
			</div>
		</div>

		<div id="csv-download-area" class="hidden">
			<button id="csv-download-btn" class="csv-btn csv-btn-green">
				<i data-lucide="download"></i> ZIPをダウンロード
			</button>
		</div>
	</div>

	<!-- メインコンテンツエリア -->
	<div id="csv-main-area">
		<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
			<h2 style="margin: 0; font-size: 18px; color: #333; display: flex; align-items: center; gap: 8px;">
				<i data-lucide="folder" style="color: #007b5e;"></i>
				<span id="csv-preview-folder-name">未選択</span>
			</h2>
		</div>

		<div class="csv-preview-container">
			<!-- 修正：style属性に max-width: 100%; と flex-shrink: 1; を設定 -->
			<div class="csv-card" style="width: 1024px; max-width: 100%; height: 768px; flex-shrink: 0;">
				<!-- 修正：ヘッダーを左右分割し、リセットボタンを追加 -->
				<div class="csv-card-header" style="justify-content: space-between;">
					<div style="display: flex; align-items: center; gap: 8px;">
						<i data-lucide="file-text" style="width:16px; height:16px;"></i> ファイル内容
					</div>
					<!-- 追加：リセットボタン -->
					<button id="csv-reset-btn" class="csv-icon-btn"
						style="font-size: 12px; padding: 2px 8px; margin: 0;">
						<i data-lucide="rotate-ccw" style="width:14px; height:14px;"></i> 編集リセット
					</button>
				</div>
				<!-- 修正：contenteditable="true" とアウトライン無効化のスタイルを追加 -->
				<div id="csv-preview-content" contenteditable="true" style="outline: none;">
					左側のメニューからCSVファイルをアップロードしてください<br></div>
			</div>
			<!-- 修正：こちらも max-width: 100%; と flex-shrink: 1; を設定 -->
			<div class="csv-card" style="width: 300px; max-width: 100%; height: 768px; flex-shrink: 1;">
				<div class="csv-card-header" style="justify-content: space-between;">
					<div style="display: flex; align-items: center; gap: 8px;">
						<i data-lucide="list-tree" style="width:16px; height:16px;"></i> 生成ファイル構成
					</div>
					<!-- 追加：ファイル追加ボタン -->
					<label id="csv-add-file-btn" class="csv-icon-btn"
						style="font-size: 12px; padding: 2px 8px; margin: 0; cursor: pointer; font-weight: normal;">
						<i data-lucide="plus" style="width:14px; height:14px;"></i> ファイル追加
						<input type="file" id="csv-add-file-input" multiple class="hidden" />
					</label>
				</div>
				<div id="csv-tree-container">CSVアップロード後に表示<br>（ドラッグ＆ドロップでファイル追加可能）</div>
			</div>
		</div>

		<script src="js/folder-generation.js"></script>

</body>

</html>
