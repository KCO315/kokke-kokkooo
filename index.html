<!DOCTYPE html>
<html lang="ja">

<head>
	<meta name="robots" content="noindex">
	<meta charset="UTF-8">
	<title>発表配信ツール コッケコッコー!!!</title>
	<script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"
		integrity="sha384-E1pALgGQd5jo9+CjsxlKe6NWRynty/TMVcFeBANdn+V5RTR5v+POlW5Ys+JJrUa8"
		crossorigin="anonymous"></script>
	<link
		href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP&family=Sawarabi+Gothic&family=Sawarabi+Mincho&family=Yomogi&family=Zen+Maru+Gothic&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" href="favicon.ico">
</head>

<body>
	<div id="mobile-warning" class="mobile-warning">
		<i data-lucide="monitor" style="width: 48px; height: 48px; margin-bottom: 16px; color: #328f74;"></i>
		<p style="line-height: 1.6;">このツールはPCでの利用を想定しています。<br>画面幅を広くするか、モニターで表示してください。</p>
	</div>

	<!-- アクティビティバー -->
	<div id="activity-bar">
		<div style="display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center;">
			<button id="nav-csv-btn" class="activity-icon active" title="フォルダ生成">
				<i data-lucide="folder-plus"></i>
				<span>準備</span>
			</button>
			<button id="nav-preview-btn" class="activity-icon" title="データプレビュー">
				<i data-lucide="monitor-play"></i>
				<span>配信</span>
			</button>
		</div>
		<div
			style="margin-top: auto; margin-bottom: 15px; width: 100%; display: flex; flex-direction: column; gap: 15px; align-items: center;">
			<a href="https://docs.google.com/presentation/d/e/2PACX-1vQ0zbx3zIaUR9DdwUqtrW3qddqBp3nITSoS6YWzflAKAvqC7lmeWDBMTT_8yBL_Zm_DlNdxTqxTViGn/pub?start=false&loop=false&delayms=3000"
				target="_blank" class="activity-icon" title="使い方">
				<i data-lucide="help-circle"></i>
				<span>使い方</span>
			</a>
			<button id="global-settings-btn" class="activity-icon" title="初期設定">
				<i data-lucide="settings"></i>
				<span>設定</span>
			</button>
		</div>
	</div>

	<!-- iframeコンテナ -->
	<div id="content-area">
		<iframe id="frame-csv" src="folder-generation.html" style="display: block;"></iframe>
		<iframe id="frame-preview" src="data-preview.html" style="display: none;"></iframe>
	</div>

	<!-- 共通設定モーダル -->
	<div id="global-settings-modal-overlay">
		<button id="global-close-settings-btn"><i data-lucide="x"></i></button>
		<div class="settings-modal-content" id="settings-modal-content">

			<div class="help-tab-container">
				<button class="help-tab-btn" data-tab="help-preview">
					<i data-lucide="monitor-play" style="width: 18px; height: 18px;"></i>配信モード
				</button>
			</div>

			<div class="help-tab-body">

				<!-- データプレビュー タブ -->
				<div id="help-preview" class="help-tab-content">
					<h3 class="tw-group-title">README表示設定</h3>
					<div class="tw-setting-group">
						<div class="tw-setting-row">
							<div class="tw-setting-info">
								<i data-lucide="type" class="tw-setting-icon"></i>
								<div class="tw-setting-text">
									<label class="tw-label">フォントとサイズ</label>
									<div class="tw-hint">表示するテキストの見た目を変更します</div>
								</div>
							</div>
							<div class="tw-setting-action">
								<div style="display: flex; align-items: center; gap: 8px;">
									<input type="number" class="tw-input" id="setting-readme-font-size" value="20"
										min="10" max="100" style="width: 70px; text-align: center;" title="サイズ(px)">
									<span style="color: #c3c3bb; font-size: 14px; margin-right: 4px;">px</span>
									<select class="tw-select" id="setting-readme-font" style="width: 150px;">
										<option value="'Sawarabi Gothic', sans-serif" selected>ゴシック</option>
										<option value="'Zen Maru Gothic', sans-serif">丸ゴシック</option>
										<option value="'Noto Serif JP', serif">明朝体</option>
										<option value="'Yomogi', cursive">筆記体</option>
										<option value='"Segoe UI", "Meiryo", sans-serif'>標準フォント</option>
									</select>
								</div>
							</div>
						</div>
						<div class="tw-setting-row">
							<div class="tw-setting-info">
								<i data-lucide="palette" class="tw-setting-icon"></i>
								<div class="tw-setting-text">
									<label class="tw-label" for="setting-readme-bg">背景色</label>
									<div class="tw-hint">プレビューの背景色を指定します</div>
								</div>
							</div>
							<div class="tw-setting-action">
								<input type="color" class="tw-input-color" id="setting-readme-bg" value="#fdfbf7"
									style="width: 80px;">
							</div>
						</div>
						<div class="tw-setting-row">
							<div class="tw-setting-info">
								<i data-lucide="rotate-ccw" class="tw-setting-icon"></i>
								<div class="tw-setting-text">
									<label class="tw-label">初期状態に戻す</label>
									<div class="tw-hint">READMEの表示設定をデフォルトにリセットします</div>
								</div>
							</div>
							<div class="tw-setting-action">
								<button type="button" class="tw-btn tw-btn-danger" id="reset-readme-btn"
									style="width: 100px;">
									リセット
								</button>
							</div>
						</div>
					</div>

					<!-- データプレビュー タブ内に追加 -->
					<h3 class="tw-group-title">リスト表示設定</h3>
					<div class="tw-setting-group">
						<div class="tw-setting-row">
							<div class="tw-setting-info">
								<i data-lucide="eye-off" class="tw-setting-icon"></i>
								<div class="tw-setting-text">
									<label class="tw-label" for="setting-mosaic-below">未発表のグループにモザイクをかける</label>
									<div class="tw-hint">選択中のグループより下にあるグループをぼかして表示します。フォルダ名にカテゴリがある場合、カテゴリ名が表示されます
									</div>
								</div>
							</div>
							<div class="tw-setting-action">
								<label class="toggle-switch">
									<input type="checkbox" id="setting-mosaic-below">
									<span class="toggle-slider"></span>
								</label>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>

	<!-- 分割したJSを読み込み -->
	<script src="js/index.js"></script>
</body>

</html>
